<main class="flex flex-col space-y-6 justify-center items-center bg-gray-100 pt-10">
  <h1>{{ title() }}</h1>

  <app-navbar></app-navbar>
  <div class="border p-4 rounded-xl w-full">
    @for (item of noticias(); track item) {
      <div class="border p-4 mb-6 rounded-xl hover:bg-gray-200 hover:text-white">
        <div>
          <div class="flex justify-between text-xs text-gray-400 pb-6">
            <div>Date : {{ item.dataCadastro }}</div>
            <div>{{ item.titulo }}</div>
          </div>
        </div>
        <div>
          <p>{{ item.informacao }}</p>
        </div>
      </div>
    }
  </div>
</main>
